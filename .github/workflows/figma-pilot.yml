name: Figma pilot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/figma-pilot.yml
      - .node-version
      - package*.json
      - tsconfig.json
      - figma-checker.config.json
      - src/**
      - site/**
      - test/**
  workflow_dispatch:
    inputs:
      mode:
        description: Scan the fixture or publish a live Figma report to the public site
        type: choice
        options:
          - fixture
          - live
        default: fixture
      figma_link:
        description: Figma page or frame link for a public live report
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: github-pages
  queue: max

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      history_recorded: ${{ steps.store.outputs.recorded }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build

      - name: Generate synthetic Figma report
        id: fixture
        if: ${{ inputs.mode == 'fixture' }}
        continue-on-error: true
        run: npm run sample:report

      - name: Generate live Figma report
        id: live
        if: ${{ inputs.mode == 'live' }}
        continue-on-error: true
        env:
          FIGMA_URL: ${{ inputs.figma_link || secrets.FIGMA_URL }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: npm run check:figma

      - uses: actions/checkout@v5
        with:
          ref: main
          path: report-store

      - name: Record the report in durable history
        id: store
        working-directory: report-store
        run: |
          test -s ../reports/report.json
          history_ref=$(git ls-remote origin refs/heads/report-history)
          if [ -n "$history_ref" ]; then
            git fetch --no-tags --depth=1 origin refs/heads/report-history
            git switch --detach FETCH_HEAD
          else
            git switch --orphan report-history
          fi
          node ../dist/history.js append history.json ../reports/report.json "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git add -- history.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Record Figma run $GITHUB_RUN_ID"
            git push origin HEAD:refs/heads/report-history
          fi
          echo 'recorded=true' >> "$GITHUB_OUTPUT"

      - name: Upload Figma report
        uses: actions/upload-artifact@v4
        with:
          name: figma-report-${{ inputs.mode }}-${{ github.run_attempt }}
          path: reports/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Signal unsuccessful scan
        if: steps.fixture.outcome == 'failure' || steps.live.outcome == 'failure'
        run: |
          echo 'The scan failed. The report history contains the error.'
          exit 1

  publish:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.record.result == 'skipped' || needs.record.outputs.history_recorded == 'true') }}
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Load the saved public report history
        run: |
          mkdir -p reports
          history_ref=$(git ls-remote origin refs/heads/report-history)
          if [ -n "$history_ref" ]; then
            git fetch --no-tags --depth=1 origin refs/heads/report-history
            git show FETCH_HEAD:history.json > reports/history.json
          fi
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: pages-dist
      - name: Deploy the report and history
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
